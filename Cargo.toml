[workspace]
members = ["crates/signoz-client", "crates/signoz-cli"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/cognelis/signoz-cli"

[workspace.dependencies]
assert_cmd = "2"
chrono = { version = "0.4", features = ["serde"] }
cliclack = "0.5.5"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
console = "0.16"
directories = "6"
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent", "windows-native"] }
predicates = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.9"
url = "2"
wiremock = "0.6"

[profile.release]
strip = true
